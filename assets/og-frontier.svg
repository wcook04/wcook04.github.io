<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Eight open Erdős problems — a checkable frontier</title>
  <desc id="description">One checked frontier and one stated remaining obligation for each of eight open Erdős problems.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171020"/>
      <stop offset="1" stop-color="#211527"/>
    </linearGradient>
    <radialGradient id="ember" cx="85%" cy="10%" r="84%">
      <stop offset="0" stop-color="#742f4d" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#381d40" stop-opacity=".16"/>
      <stop offset="1" stop-color="#171020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect width="1200" height="630" fill="url(#ember)"/>
  <rect x="0" width="1200" height="4" fill="#b74c78"/>
  <g fill="none" stroke="#d2a04f" stroke-opacity=".33" stroke-width="1">
