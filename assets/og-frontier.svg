    <text x="72" y="248" font-size="67" letter-spacing="-2">A checkable frontier.</text>
    <text x="72" y="315" font-size="28" fill="#ded2c5">One checked frontier and one stated</text>
    <text x="72" y="351" font-size="28" fill="#ded2c5">remaining obligation for each.</text>
  </g>
  <text x="72" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#d8a44f">ALL EIGHT REMAIN OPEN</text>
