name: Public site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test reading-map and route validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check generated front-door content
        run: |
          python3 scripts/build_absolute_frontier.py --check
          python3 scripts/build_glossary_term_layer.py --check
          python3 scripts/check_frontier_surface.py
