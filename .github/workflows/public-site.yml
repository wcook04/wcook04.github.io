name: Public site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test redirect and repository validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Keep the old homepage retired
        run: python3 scripts/check_redirect_site.py
