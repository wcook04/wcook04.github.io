name: Finish the checked personal front door
on:
  push:
    branches: [fix/complete-front-door-20260906]
    paths: [.github/workflows/finish-front-door.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/complete-front-door-20260906
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - name: Repeat the exact checked edit with whitespace repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          lines = Path('.github/workflows/complete-front-door.yml').read_text().splitlines()
          scripts = []
          for i, line in enumerate(lines):
              if line.strip() != 'run: |':
                  continue
              body = []
              for following in lines[i+1:]:
                  if following.strip() and not following.startswith('          '):
                      break
                  body.append(following)
              scripts.append(textwrap.dedent('\n'.join(body)))
          if len(scripts) != 3:
              raise SystemExit('Expected exactly three bounded preparation/check/commit scripts')
          anchor = 'index.write_text(page)'
          if scripts[0].count(anchor) != 1:
              raise SystemExit('Missing exact whitespace repair anchor')
          scripts[0] = scripts[0].replace(anchor, "index.write_text(re.sub(r'(?m)^[ \\t]+$', '', page))")
          anchor = 'git rm -- .github/workflows/complete-front-door.yml'
          if scripts[2].count(anchor) != 1:
              raise SystemExit('Missing exact preparation cleanup anchor')
          scripts[2] = scripts[2].replace(anchor, anchor + ' .github/workflows/finish-front-door.yml')
          for script in scripts:
              subprocess.run(['bash','-euo','pipefail','-c',script], check=True)
          PY
