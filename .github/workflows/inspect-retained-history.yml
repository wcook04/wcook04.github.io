name: Inspect retained history findings
on:
  push:
    branches: [fix/complete-front-door-20260906]
    paths: [.github/workflows/inspect-retained-history.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the public retained report and print only redacted findings
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          url = 'https://raw.githubusercontent.com/wcook04/plectis-erdos/5303ea41ecb19f2507e5b4177cfba8ca965bad34/docs/release/reachable-history-audit.json'
          with urlopen(url, timeout=60) as response:
              data = json.load(response)
          print('HISTORICAL_REPORT_ONLY', data.get('generated_at'))
          for key in ('scan', 'inventory', 'release_decision', 'release_blockers'):
              value = data.get(key)
              if key == 'release_blockers' and isinstance(value, list):
                  print(key, 'count', len(value))
                  for row in value[:30]: print(json.dumps(row, sort_keys=True))
              else:
                  print(key, json.dumps(value, sort_keys=True))
          PY
