<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Will Cook</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <meta name="theme-color" content="#171020">
  <style>
    /* Nocturnal in both schemes, matching the front page: a visitor who lands
       here in light mode and clicks through should not cross a colour break.
       color-scheme carries that to the user agent's own furniture too. */
    :root {
      color-scheme: dark;
      --page: #171020; --ink: #f2e6d4; --muted: #a9998f;
      --accent: #9db3e8; --accent-strong: #c3d0f2;
      --wash-warm: #e0a23f; --wash-warm-a: 17%;
      --wash-cool: #4358bb; --wash-cool-a: 13%;
      --wash-rose: #c4508e; --wash-rose-a: 8%;
      --wash-ember: #c8552e; --wash-ember-a: 8%;
      --accent-wash: #2b2a52;
    }
    /* border-box or the padding is added to the viewport height rather than
       taken out of it, and a page with one screen of content on it acquires a
       64px scroll it has no reason to have. */
    body {
      box-sizing: border-box;
      position: relative;
      isolation: isolate;
      margin: 0; min-height: 100vh; min-height: 100svh;
      background: var(--page); color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; line-height: 1.6;
    }
    body::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 760px;
      pointer-events: none; z-index: -1;
      background:
        radial-gradient(120% 103% at 16% -12%, color-mix(in srgb, var(--wash-warm) var(--wash-warm-a), transparent), transparent 68%),
        radial-gradient(95% 89% at 97% -7%, color-mix(in srgb, var(--wash-cool) var(--wash-cool-a), transparent), transparent 64%),
        radial-gradient(48% 48% at 70% 12%, color-mix(in srgb, var(--wash-rose) var(--wash-rose-a), transparent), transparent 60%),
        radial-gradient(55% 41% at 26% 60%, color-mix(in srgb, var(--wash-ember) var(--wash-ember-a), transparent), transparent 58%),
        radial-gradient(110% 68% at 50% -21%, color-mix(in srgb, var(--accent-wash) 30%, transparent), transparent 74%);
      -webkit-mask-image: linear-gradient(to bottom, #000 0 60%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 0 60%, transparent 100%);
    }
    /* Same ember as the front page and the Plectis sheet: two pixels, and the
       ramp taken from that sheet rather than restated. */
    .thread {
      position: fixed; top: 0; left: 0; right: 0; height: 2px; opacity: .85;
      background: linear-gradient(90deg, #1c1440 0%, #55175a 11%, #a83030 24%,
        #e89b3c 33%, #c05028 47%, #802046 63%, #c9679f 71%, #472468 84%,
        #131a38 100%);
    }
    img { width: 48px; height: 48px; border-radius: 11px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; max-width: 26rem; }
    a { color: var(--accent); text-underline-offset: 0.16em; }
    a:hover, a:focus-visible { color: var(--accent-strong); }
    /* The colour shift alone is not a focus indicator. It is a colour change
       of about 1.4:1 against the resting state, invisible to a good many
       readers. The ring is the same one the front page uses. */
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 1px; }
  </style>
</head>
<body>
  <div class="thread"></div>
  <img src="/assets/favicon.svg" width="48" height="48" alt="">
  <h1>Not found</h1>
  <p>There is nothing at this address.</p>
  <p><a href="/">Go to the front page</a> &nbsp;·&nbsp; <a href="/plectis/">Plectis</a></p>
</body>
</html>
